server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: qbalways-search-service

qbalways:
  solr:
    url: ${SOLR_URL:http://localhost:8983}
    collection: ${SOLR_COLLECTION:qbalways}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:chrome-extension://*,http://localhost:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
